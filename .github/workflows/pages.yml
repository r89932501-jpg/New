name: Publish Profile web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack app and prepare installable web app
        run: |
          set -e
          mkdir -p site
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found in repository root"
            exit 1
          fi
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked
          INDEX_FILE="$(find unpacked -type f -iname 'index.html' | head -n 1)"
          if [ -z "$INDEX_FILE" ]; then
            echo "index.html not found inside the uploaded ZIP"
            find unpacked -maxdepth 3 -type f | head -n 80
            exit 1
          fi
          APP_DIR="$(dirname "$INDEX_FILE")"
          cp -a "$APP_DIR"/. site/
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(".top{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:10px}", ".top{display:grid;grid-template-columns:1.2fr .8fr;gap:10px}")
          s = s.replace(".top{grid-template-columns:repeat(3,minmax(0,1fr))}", ".top{grid-template-columns:repeat(2,minmax(0,1fr))}")
          s = s.replace("УСТРАНЕНИЕ НЕИСПРАВНОСТЕЙ ЭЛЕКТРОВОЗА 3ЭС5К", "УСТРАНЕНИЕ НЕИСПРАВНОСТЕЙ 3ЭС5К С ПООСНЫМ РЕГУЛИРОВАНИЕМ")
          s = re.sub(r"По пособию\s+А\.\s*А\.\s*Мамонтова.*?2022 г\.", "", s, flags=re.S)
          s = s.replace("back=S.tripStarted?Math.max(W*.1,S.trainLength+120):W*.1;", "back=S.tripStarted?Math.max(W*.18,S.trainLength+120):W*.18;")
          s = s.replace("back=W*0.1, km=S.kmDraw", "back=W*0.18, km=S.kmDraw")
          s = s.replace("oldBack=oldW*.1", "oldBack=oldW*.18")
          s = s.replace('      <div class="tools" id="tools">', '      <div class="tools" id="tools">      <div class="current-position num" id="currentPosition">— км · — пк</div>')

          # Remove all clock displays from the profile screen, leaving the menu clock intact.
          s = s.replace('    <div class="cell"><div class="lbl">Время</div><div class="big num" id="clock">--:--:--</div><div class="sub">Местное · МСК <span class="num" id="mskClock" style="color:#9fd8ff;font-size:14px">--:--:--</span></div></div>', '')
          s = s.replace(
              '<div class="chips" id="chips"><div class="chip2 msk" id="mskChip"><span class="k">МСК</span><b class="v">--:--:--</b></div></div>',
              '<div class="chips" id="chips"><div class="chip2 pos" id="posChip"><span class="k">КМ · ПК</span><b class="v">— · —</b></div></div>'
          )
          s = s.replace("  $('clock').textContent=new Date().toLocaleTimeString('ru-RU',{hour12:false});\n", "")
          s = s.replace("const mskStr=()=>new Date().toLocaleTimeString('ru-RU',{hour12:false,timeZone:'Europe/Moscow'});\n", "")
          s = s.replace("$('mskChip').querySelector('.v').textContent=mskStr();\n", "")
          s = s.replace("  const now=performance.now(), msk=mskStr();\n  $('mskChip').querySelector('.v').textContent=msk; $('mskClock').textContent=msk;", "  const now=performance.now();")
          s = s.replace(
              "$('kmOverlay').textContent=Math.floor(km/1000)+' км '+String(pkOf(km)).padStart(2,'0')+' пк';",
              "const kmText=Math.floor(km/1000)+' км '+String(pkOf(km)).padStart(2,'0')+' пк';\n  $('kmOverlay').textContent=kmText; $('posChip').querySelector('.v').textContent=Math.floor(km/1000)+' · '+String(pkOf(km)).padStart(2,'0');"
          )

          s = s.replace("const kmText=Math.floor(km/1000)+' км '+String(pkOf(km)).padStart(2,'0')+' пк';", "const kmText=Math.floor(km/1000)+' км '+String(pkOf(km)).padStart(2,'0')+' пк'; $('currentPosition').textContent=kmText;")
          s = s.replace("ctx.fillText(String(km/1000),x,axisY-3);", "ctx.fillText(String(km/1000),x,axisY-13);")

          # Make the signal markers larger and display signal identifiers at useful zoom levels.
          sig_start = s.index("  // Светофоры: короткие столбики, привязанные непосредственно к линии профиля")
          sig_end = s.index("  ctx.restore();\n  // верхняя ось:", sig_start)
          signal_code = """  // Светофоры: увеличенная нейтральная пиктограмма с номером.
          // Жёлтый маркер обозначает только место объекта, а не показание сигнала.
          let lastSignalLabelX=-Infinity;
          const signalLabelGap=(W<=3000?34:W<=5000?58:W<=10000?92:Infinity)*k;
          ds.SG.forEach(sig=>{
            if(sig.t<a||sig.t>b) return;
            const x=px(X(sig.t)), y=py(R(sig.t));
            ctx.save();
            const mastTop=y-29*k;
            ctx.lineCap='round'; ctx.strokeStyle='#f2c14e'; ctx.lineWidth=2.2*k;
            ctx.beginPath(); ctx.moveTo(x,y-2*k); ctx.lineTo(x,mastTop+3*k); ctx.stroke();
            const bw=10*k,bh=18*k;
            ctx.fillStyle='#11191d'; ctx.strokeStyle='#e6bd59'; ctx.lineWidth=1.5*k;
            ctx.beginPath(); ctx.roundRect(x-bw/2,mastTop-bh+4*k,bw,bh,3*k); ctx.fill(); ctx.stroke();
            ctx.fillStyle='#f2c14e'; ctx.beginPath(); ctx.arc(x,mastTop-5*k,3.4*k,0,Math.PI*2); ctx.fill();
            ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=1*k;
            ctx.beginPath(); ctx.moveTo(x-5*k,y); ctx.lineTo(x+5*k,y); ctx.stroke();
            if(x-lastSignalLabelX>=signalLabelGap && x>padL+12*k && x<w-padR-12*k){
              const label=String(sig.name); ctx.font=F(11,700,C('--f-num')); ctx.textAlign='center'; ctx.textBaseline='bottom';
              const tw=ctx.measureText(label).width; const ly=mastTop-10*k;
              ctx.fillStyle='rgba(8,13,15,.94)'; ctx.fillRect(x-tw/2-5*k,ly-13*k,tw+10*k,15*k);
              ctx.strokeStyle='rgba(242,193,78,.7)'; ctx.lineWidth=1*k; ctx.strokeRect(x-tw/2-5*k,ly-13*k,tw+10*k,15*k);
              ctx.fillStyle='#ffe2a0'; ctx.fillText(label,x,ly); lastSignalLabelX=x;
            }
            ctx.restore();
          });
          """
          s = s[:sig_start] + signal_code + s[sig_end:]

          # Replace the simple train bar with individual wagons and a locomotive silhouette.
          train_start = s.index("  // Голова поезда всегда привязана к GPS. Состав тянется назад по фактическому профилю.")
          train_end = s.index("  drawMarks({px,X,plotTop,plotBot,F,k});", train_start)
          train_code = """  // Голова состава привязана к GPS. Показываем локомотив и вагоны вдоль профиля.
          const x0=px(0), y0=py(0);
          if(S.tripStarted && S.trainLength>0){
            const tailT=t0-S.trainLength, visibleTail=Math.max(a,tailT);
            const pPerM=pw/W;
            ctx.save(); ctx.beginPath(); ctx.rect(padL,plotTop-6,pw,plotBot-plotTop+14); ctx.clip();
            const ptsTrain=[]; const step=Math.max(8,Math.min(25,S.trainLength/35));
            for(let m=visibleTail;m<t0;m+=step) ptsTrain.push([px(X(m)),py(R(m))]);
            ptsTrain.push([x0,y0]);
            if(ptsTrain.length>1){
              ctx.beginPath(); ptsTrain.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
              ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#182a35'; ctx.lineWidth=16*k; ctx.stroke();
              ctx.strokeStyle='#91a7b4'; ctx.lineWidth=1.2*k; ctx.stroke();
            }
            if(pPerM*40>=5*k){
              for(let d=40;d<S.trainLength-12;d+=40){
                const c0=t0-d-14, c1=t0-d+14; if(c0<visibleTail||c1>t0-25) continue;
                const p1=projectedPoint(c0),p2=projectedPoint(c1);
                const dx=p2.x-p1.x,dy=p2.y-p1.y,L=Math.max(7*k,Math.hypot(dx,dy));
                const ang=Math.atan2(dy,dx),mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
                ctx.save(); ctx.translate(mx,my); ctx.rotate(ang);
                ctx.fillStyle='#34566a'; ctx.strokeStyle='#c3d1d8'; ctx.lineWidth=1*k;
                ctx.beginPath(); ctx.roundRect(-L/2,-5.5*k,L,11*k,2*k); ctx.fill(); ctx.stroke();
                ctx.fillStyle='#9fb4bf'; ctx.fillRect(-L*.28,-3.5*k,Math.max(2*k,L*.56),1.3*k);
                ctx.fillStyle='#101a20';
                for(const wx of [-L*.28,L*.28]){ctx.beginPath();ctx.arc(wx,5*k,1.8*k,0,Math.PI*2);ctx.fill();}
                ctx.restore();
              }
            }
            const back=projectedPoint(t0-27), front=projectedPoint(t0-1);
            const dx=front.x-back.x,dy=front.y-back.y,L=Math.max(13*k,Math.hypot(dx,dy));
            const ang=Math.atan2(dy,dx),mx=(front.x+back.x)/2,my=(front.y+back.y)/2;
            ctx.save(); ctx.translate(mx,my); ctx.rotate(ang);
            ctx.fillStyle='#d58b2e'; ctx.strokeStyle='#ffe0a0'; ctx.lineWidth=1.5*k;
            ctx.beginPath(); ctx.roundRect(-L/2,-7*k,L,14*k,3*k); ctx.fill(); ctx.stroke();
            ctx.fillStyle='#253a46'; ctx.beginPath(); ctx.roundRect(L*.05,-5*k,L*.30,7*k,1.5*k); ctx.fill();
            ctx.fillStyle='#a9d8e8'; ctx.fillRect(L*.12,-4*k,Math.max(2*k,L*.12),4*k);
            ctx.fillStyle='#fff4c7'; ctx.beginPath(); ctx.arc(L/2-1*k,0,2.2*k,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#17232b';
            for(const wx of [-L*.30,L*.30]){ctx.beginPath();ctx.arc(wx,7*k,2*k,0,Math.PI*2);ctx.fill();}
            ctx.restore(); ctx.restore();
            if(tailT>=a){ const tx=px(X(tailT)),ty=py(R(tailT)); ctx.fillStyle='#e7eeec';ctx.font=F(11,700);ctx.textAlign='center';ctx.fillText('ХВОСТ',tx,ty-15*k); }
            ctx.strokeStyle=C('--mark');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x0,plotTop-4);ctx.lineTo(x0,plotBot);ctx.stroke();
            ctx.fillStyle=C('--mark');ctx.beginPath();ctx.moveTo(x0-6,plotTop-12);ctx.lineTo(x0+6,plotTop-12);ctx.lineTo(x0,plotTop-2);ctx.closePath();ctx.fill();
            ctx.fillStyle=C('--warn');ctx.font=F(10,700);ctx.textAlign='left';ctx.fillText('ГОЛОВА GPS',x0+8,plotTop+9);
          } else {
            ctx.strokeStyle=C('--mark'); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x0,plotTop-4); ctx.lineTo(x0,plotBot); ctx.stroke();
            ctx.fillStyle=C('--mark'); ctx.beginPath(); ctx.moveTo(x0-6,plotTop-12); ctx.lineTo(x0+6,plotTop-12); ctx.lineTo(x0,plotTop-2); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.arc(x0,y0,4.5,0,Math.PI*2); ctx.fillStyle=C('--bg'); ctx.fill(); ctx.lineWidth=2; ctx.stroke();
          }
          """
          s = s[:train_start] + train_code + s[train_end:]

          s = s.replace(
              '<div class="km-overlay num" id="kmOverlay" aria-live="off">—</div>',
              '<div class="km-overlay num" id="kmOverlay" aria-live="off">—</div><div class="signal-legend"><span class="signal-legend-mark"></span><span>Светофор · подпись — обозначение</span></div>'
          )

          s = s.replace(
              '</style><link rel="stylesheet" href="shell.css">',
              '.signal-legend{position:absolute;top:7px;right:10px;z-index:4;display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid rgba(242,193,78,.35);border-radius:8px;background:rgba(12,17,19,.78);color:#e7eeec;font:600 10px/1.2 var(--f-ui);pointer-events:none}\n.signal-legend-mark{position:relative;width:8px;height:15px;border-left:2px solid #f2c14e}.signal-legend-mark:before{content:"";position:absolute;left:-5px;top:0;width:8px;height:8px;border-radius:3px;background:#26323a;border:1px solid #f2c14e}.signal-legend-mark:after{content:"";position:absolute;left:-2px;top:3px;width:3px;height:3px;border-radius:50%;background:#f2c14e}@media(max-width:520px){.signal-legend{font-size:9px;top:6px;right:6px;padding:3px 6px}}\n</style><link rel="stylesheet" href="shell.css">'
          )
          # Remove floating kilometer/picket labels and the explanatory signal legend.
          s = s.replace('<div class="km-overlay num" id="kmOverlay" aria-live="off">—</div>', '')
          s = s.replace('<div class="signal-legend"><span class="signal-legend-mark"></span><span>Светофор · подпись — обозначение</span></div>', '')
          s = s.replace('<div class="chips" id="chips"><div class="chip2 pos" id="posChip"><span class="k">КМ · ПК</span><b class="v">— · —</b></div></div>', '<div class="chips" id="chips"></div>')
          s = s.replace('<div class="chips" id="chips"></div>', '<div class="chips" id="chips"><div class="current-position num" id="currentPosition">— км · — пк</div></div>')
          s = s.replace("  $('kmOverlay').textContent=kmText; $('posChip').querySelector('.v').textContent=Math.floor(km/1000)+' · '+String(pkOf(km)).padStart(2,'0');", '')
          s = s.replace("const kmText=Math.floor(km/1000)+' км '+String(pkOf(km)).padStart(2,'0')+' пк';\n  $('kmOverlay').textContent=kmText; $('posChip').querySelector('.v').textContent=Math.floor(km/1000)+' · '+String(pkOf(km)).padStart(2,'0');", "const kmText=Math.floor(km/1000)+' км '+String(pkOf(km)).padStart(2,'0')+' пк'; $('currentPosition').textContent=kmText;")

          # Replace preset scale buttons with two continuous, touch-friendly sliders.
          old_controls = '      <div class="tbg"><span class="lbl">Масштаб, км</span>\n        <div class="seg" id="segWin"><button type="button" data-v="1" aria-pressed="false">1</button><button type="button" data-v="2" aria-pressed="false">2</button><button type="button" data-v="3" aria-pressed="false">3</button><button type="button" data-v="5" aria-pressed="true">5</button><button type="button" data-v="10" aria-pressed="false">10</button><button type="button" data-v="20" aria-pressed="false">20</button></div></div>\n      <div class="tbg"><span class="lbl">Масштаб по высоте, м</span>\n        <div class="seg" id="segVs"><button type="button" data-v="auto" aria-pressed="true">Авто</button><button type="button" data-v="20" aria-pressed="false">20</button><button type="button" data-v="40" aria-pressed="false">40</button><button type="button" data-v="80" aria-pressed="false">80</button></div></div>'
          new_controls = '      <label class="scale-control"><span class="lbl">Окно профиля: <b id="winScaleValue">5 км</b></span><input type="range" id="winScale" min="0.5" max="20" step="0.5" value="5" aria-label="Масштаб километров"></label>\n      <label class="scale-control"><span class="lbl">Высота профиля: <b id="heightScaleValue">±40 м</b></span><input type="range" id="heightScale" min="20" max="200" step="5" value="80" aria-label="Вертикальный масштаб уклонов"></label>'
          if old_controls not in s:
              raise SystemExit("Scale controls markup not found")
          s = s.replace(old_controls, new_controls)
          s = s.replace("win:5,winDraw:5,vs:'auto'", "win:5,winDraw:5,vs:'80'")
          s = s.replace("document.querySelectorAll('#segWin button').forEach(b=>b.onclick=()=>{ S.win=+b.dataset.v; setPressed('segWin',S.win); S.yMin=null; update(); });", "const winScale=$('winScale'), heightScale=$('heightScale');\nfunction syncScaleLabels(){ $('winScaleValue').textContent=Number(S.win).toLocaleString('ru-RU',{maximumFractionDigits:1})+' км'; $('heightScaleValue').textContent='±'+Math.round(Number(S.vs)/2)+' м'; winScale.value=String(S.win); heightScale.value=String(S.vs); }\nwinScale.oninput=()=>{ S.win=+winScale.value; S.yMin=null; syncScaleLabels(); };\nheightScale.oninput=()=>{ S.vs=heightScale.value; S.yShift=0; S.yMin=null; syncScaleLabels(); };\nsyncScaleLabels();")
          s = s.replace("document.querySelectorAll('#segVs button').forEach(b=>b.onclick=()=>{ S.vs=b.dataset.v; S.yShift=0; setPressed('segVs',S.vs); S.yMin=null; });", "")
          s = s.replace("setPressed('segWin',String(opts.reduce((a,b)=>Math.abs(b-S.win)<Math.abs(a-S.win)?b:a,opts[0])));", "winScale.value=String(S.win); syncScaleLabels();")
          css = Path("site/shell.css")
          with css.open("a", encoding="utf-8") as f:
              f.write("\n.tools{bottom:calc(8px + env(safe-area-inset-bottom,0px))}.chips .current-position{position:static;display:block;margin:0 0 0 10px;padding:6px 10px;border:1px solid rgba(106,168,255,.55);border-radius:8px;background:rgba(8,14,17,.94);color:#e7f2ff;font:700 14px/1.2 var(--f-num);white-space:nowrap;letter-spacing:.02em;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}@media(max-width:520px){.chips .current-position{margin-left:10px;padding:5px 8px;font-size:12px}}.current-position{position:static;margin-left:10px;margin-bottom:0;z-index:5;padding:6px 10px;border:1px solid rgba(106,168,255,.48);border-radius:8px;background:rgba(8,14,17,.9);color:#e7f2ff;font:700 14px/1.2 var(--f-num);letter-spacing:.02em;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}@media(max-width:520px){.current-position{margin-left:10px;padding:5px 8px;font-size:12px}}\n.tb .scale-control{display:flex;flex-direction:column;gap:3px;min-width:150px;flex:1 1 180px}.tb .scale-control .lbl{white-space:nowrap}.tb .scale-control b{color:var(--warn);font-variant-numeric:tabular-nums}.tb .scale-control input[type=range]{width:100%;min-width:140px;height:24px;margin:0;touch-action:pan-x}.tb .btn{flex:0 0 auto}\n")

          p.write_text(s, encoding="utf-8")

          # Clean up the 3ЭС5К handbook header and remove bulk expand/collapse controls.
          manual = Path("site/3ES5K.html")
          if manual.exists():
              h = manual.read_text(encoding="utf-8")
              h = re.sub(r'<div class="sub">.*?</div>', '', h, flags=re.S)
              h = re.sub(r'<h1>.*?</h1>', '<h1>Устранение неисправностей<br/>3ЭС5К с поосным регулированием</h1>', h, count=1, flags=re.S)
              h = re.sub(r'<div class="actions">.*?</div>', '', h, count=1, flags=re.S)
              h = re.sub(r'<button[^>]*id="(?:openAll|closeAll)"[^>]*>.*?</button>', '', h, flags=re.S)
              manual.write_text(h, encoding="utf-8")

          css = Path("site/shell.css")
          with css.open("a", encoding="utf-8") as f:
              f.write("\n.chip2.pos{padding-right:12px;border-color:rgba(106,168,255,.45);background:rgba(12,17,19,.92)}\n.chip2.pos .k{color:#80b8ff}.chip2.pos .v{color:#e7f2ff;font-size:18px;letter-spacing:.04em}\n")

          # One visual system across the home screen, profile, handbook, schemes and brakes.
          theme_css = r"""
          :root{
            --c-profile:#f2c14e;--c-faults:#f2c14e;--c-schemes:#f2c14e;--c-brakes:#f2c14e;
            --app-bg:#0b1012;--app-panel:#131a1d;--app-panel2:#192226;--app-line:#29373d;
            --app-text:#e7eeec;--app-muted:#91a09e;--app-accent:#f2c14e;
          }
          html[data-sec]{--sec:#f2c14e!important}
          html[data-sec] body{
            background:radial-gradient(900px 380px at 50% -140px,rgba(242,193,78,.10),transparent 70%),#0b1012!important;
            color:var(--app-text)!important;
          }
          html[data-sec] h1,html[data-sec] h2,html[data-sec] h3,html[data-sec] .title{
            font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important;
          }
          .tabbar nav{background:rgba(16,23,26,.94)!important;border-color:rgba(242,193,78,.18)!important}
          .tabbar a[aria-current=page]{color:#f2c14e!important;background:rgba(242,193,78,.13)!important}
          .tabbar a[aria-current=page]::after{background:#f2c14e!important}
          .tabbar a[aria-current=page] svg{color:#f2c14e!important}
          .tabbar a{color:#9aa8a5!important}
          .hub-top{padding-bottom:16px}
          .logo{color:#241b08!important;background:linear-gradient(145deg,#ffe08a,#d99a22)!important;box-shadow:0 6px 22px rgba(242,193,78,.22)!important;border:1px solid rgba(255,224,138,.4)}
          .wm{letter-spacing:.11em!important}
          .wm-sub{color:#a7b3af!important}
          .hub-clock em{color:#f2c14e!important}
          .hello{color:#a7b3af!important}
          .hero{border:1px solid rgba(242,193,78,.3)!important;background:linear-gradient(145deg,#1b1b16,#111719 70%)!important;box-shadow:0 16px 40px rgba(0,0,0,.22)}
          .hero::before{background:radial-gradient(closest-side,rgba(242,193,78,.18),transparent)!important}
          .hero .chip{color:#f2c14e!important;border-color:rgba(242,193,78,.35)!important}
          .hero h2 span{color:#f2c14e!important}
          .hero-chart .line{stroke:#f2c14e!important}
          .hero-chart defs linearGradient stop:first-child{stop-color:#f2c14e!important}
          .hero-stats div{background:rgba(255,255,255,.035)!important;border-color:rgba(255,255,255,.08)!important;border-radius:14px!important}
          .hero-btn{background:linear-gradient(135deg,#f7d477,#dca12e)!important;color:#241b08!important;box-shadow:0 8px 22px rgba(242,193,78,.16)!important}
          .hero-btn:hover{box-shadow:0 12px 30px rgba(242,193,78,.24)!important}
          .sect{color:#f2c14e!important;letter-spacing:.1em!important}
