          html[data-sec=brakes] .sec,html[data-sec=brakes] .res{
            background:linear-gradient(145deg,#151e21,#11181b)!important;border:1px solid #29373d!important;border-radius:16px!important;
          }
          html[data-sec=brakes] .sec b,html[data-sec=brakes] .res small,html[data-sec=brakes] .content p.sh{color:#f2c14e!important}
          html[data-sec=brakes] .sl{border-left-color:#3a4649!important}
          html[data-sec] button,html[data-sec] .btn,html[data-sec] .ib{
            border-radius:12px!important;transition:background .18s,border-color .18s,transform .15s!important;
          }
          html[data-sec] input,html[data-sec] select{border-radius:12px!important}
          html[data-sec] button:focus-visible,html[data-sec] input:focus-visible,html[data-sec] a:focus-visible{
            outline:2px solid #f2c14e!important;outline-offset:2px!important;
          }
          @media(max-width:560px){
            .hub{padding-left:14px!important;padding-right:14px!important}
